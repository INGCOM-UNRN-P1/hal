[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hal"
version = "0.1.0"
description = "Asistente forense de core dumps y análisis pedagógico post-mortem de segfaults en C"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
hal = "hal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hal"]

[tool.pytest.ini_options]
pythonpath = ["src"]

