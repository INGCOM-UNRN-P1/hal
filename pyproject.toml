[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hal"
version = "0.2.0"
description = "Asistente forense de core dumps y análisis pedagógico post-mortem de segfaults en C"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    # Núcleo común del ecosistema (N-ECO-14): contrato de línea de comandos y textos en español.
    "yutani @ git+https://github.com/INGCOM-UNRN-P1/yutani@cf49348fae40d264006fe07dee2cc9e88dd9c934",
]

[project.optional-dependencies]
# Herramientas del ecosistema que se usan como biblioteca (N-ECO-01). Referencias git fijadas
# a commits publicados; sin el extra se usa el camino propio (gcc, sin sandbox de nostromo…).
ecosistema = [
    "vasquez @ git+https://github.com/INGCOM-UNRN-P1/vasquez@709dd0594d7094a17ed003eda66cc1feb640c599",
    "daedalus @ git+https://github.com/INGCOM-UNRN-P1/daedalus@0d3da518270cea8d6a0dff85d8cec61de2e89fff",
    "nostromo @ git+https://github.com/INGCOM-UNRN-P1/nostromo@cc3f792a65de0cab4c7d846b92b0df6182994d49",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN-P1/hal"
Repository = "https://github.com/INGCOM-UNRN-P1/hal.git"
Issues = "https://github.com/INGCOM-UNRN-P1/hal/issues"

[project.scripts]
hal = "hal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hal"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
]

[tool.hatch.metadata]
# Las dependencias del ecosistema son referencias directas a git (nunca por nombre en PyPI).
allow-direct-references = true
